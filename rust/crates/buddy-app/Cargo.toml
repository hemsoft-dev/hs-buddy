[package]
name = "buddy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Buddy desktop application (GPUI)"

[[bin]]
name = "buddy"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true

# Embeds the app icon into buddy.exe (`build.rs`).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dependencies]
buddy-core = { path = "../buddy-core" }
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
gpui-kit.workspace = true
chrono.workspace = true
env_logger = "0.11"
log.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
raw-window-handle = "0.6"
# Pages inside the window (`browser_view`), on each OS's own engine.
wry = "0.57"
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "symphonia-all"] }

[target.'cfg(windows)'.dependencies]
# Child-frame navigation checks wry doesn't wire on WebView2 (`browser_view/wry_host.rs`).
webview2-com = "0.39"
windows = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# Records GTK as initialized for webkit2gtk (`browser_view/linux.rs`).
tao = { version = "0.37", default-features = false }

[dev-dependencies]
tempfile = "3"
# Headless UI tests (`#[gpui_kit::test]`).
gpui-kit = { workspace = true, features = ["test-support"] }

# Reads the built binary's resources (`tests/windows_icon.rs`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
