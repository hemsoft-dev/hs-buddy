[package]
name = "buddy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Buddy desktop application (GPUI)"

[[bin]]
name = "buddy"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true

# Embeds the app icon into buddy.exe (`build.rs`).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dependencies]
buddy-core = { path = "../buddy-core" }
gpui-kit.workspace = true
chrono.workspace = true
env_logger = "0.11"
log.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
raw-window-handle = "0.6"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "symphonia-all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`).
gpui-kit = { workspace = true, features = ["test-support"] }

# Reads the built binary's resources (`tests/windows_icon.rs`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
