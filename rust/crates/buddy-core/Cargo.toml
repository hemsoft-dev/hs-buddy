[package]
name = "buddy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Buddy domain models, configuration, and data providers (no UI)"

[dependencies]
github-copilot-sdk = "=1.0.23-preview.2"
cap-std = "=4.0.3"
tempfile = "3"
async-trait = "0.1"
bytes = "1"
http = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
reqwest.workspace = true
convex.workspace = true
keyring.workspace = true
futures.workspace = true
sha2 = "0.10"
chrono.workspace = true
sys-locale = "0.3"
alacritty_terminal = { version = "=0.26.0", default-features = false }
unicode-width = "0.2"
portable-pty = "=0.9.0"
uuid = { version = "1", features = ["v4", "serde"] }
icu_decimal = "2"
fixed_decimal = { version = "0.7", features = ["ryu"] }
icu_locale_core = "2"
icu_experimental = "0.6"
icu_datetime = "2"
icu_calendar = "2"
icu_time = "2"

[dev-dependencies]
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
