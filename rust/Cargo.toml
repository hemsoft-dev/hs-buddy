[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# GPUI Kit tracks weekly Zed snapshots; pin exactly and bump deliberately.
gpui-kit = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# OS trust store: webpki-roots 0.26 (the only path tokio-tungstenite 0.28 offers
# for bundled roots) still ships the distrusted emSign root (RUSTSEC-2026-0381).
convex = { version = "0.10", default-features = false, features = ["rustls-tls-native-roots"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
futures = "0.3"
chrono = "0.4"

[profile.dev]
debug = "line-tables-only"

# GPUI is unusably slow fully unoptimized; optimize dependencies only.
[profile.dev.package."*"]
opt-level = 1
