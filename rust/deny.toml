# cargo-deny policy for the native workspace (run: `cargo deny check` in rust/).
# Advisories and sources are hard gates in CI; licenses are allow-listed.

[graph]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Vulnerabilities fail the build. Unmaintained-crate notices are enforced for
# this workspace's own dependencies; the GPUI and Convex trees carry a few
# transitively (rustybuzz, ttf-parser, paste, instant, rustls-pemfile) that
# only their upstreams can replace.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
