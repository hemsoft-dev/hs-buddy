[build]
# Keep memory use bounded on developer machines; CI overrides with CARGO_BUILD_JOBS.
jobs = 4

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Installed Windows builds must run without a separate Visual C++ runtime.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
