name: Benchmarks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Classify benchmark impact
        id: policy
        run: bun scripts/bench-policy.ts

      - name: Cache Bun dependencies
        if: steps.policy.outputs.mode != 'skip'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-bun-native-${{ hashFiles('bun.lock', '.github/actions/setup-bun/action.yml', '.github/workflows/ci.yml', '.github/workflows/benchmarks.yml') }}

      - name: Install candidate dependencies
        if: steps.policy.outputs.mode != 'skip'
        run: bun install --frozen-lockfile

      - name: Install comparison baseline
        if: steps.policy.outputs.mode != 'skip'
        id: baseline
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy.outputs.base }}
          MODE: ${{ steps.policy.outputs.mode }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/bench-baseline" "$BASE_SHA"
          cd "$RUNNER_TEMP/bench-baseline"
          if ! bun install --frozen-lockfile; then
            if [[ "$MODE" == "advisory" ]]; then
              echo "Benchmark comparison unavailable: baseline install failed. Advisory reasons are retained in bench-policy.json." | tee "$GITHUB_WORKSPACE/bench-summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "unavailable=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

      - name: Collect interleaved benchmark samples
        if: steps.policy.outputs.mode != 'skip' && steps.baseline.outputs.unavailable != 'true'
        shell: bash
        run: |
          for run in 1 2 3; do
            if (( run % 2 == 1 )); then
              order="baseline candidate"
            else
              order="candidate baseline"
            fi
            for revision in $order; do
              if [[ "$revision" == "baseline" ]]; then
                directory="$RUNNER_TEMP/bench-baseline"
                output="$GITHUB_WORKSPACE/bench-baseline-run-${run}.json"
              else
                directory="$GITHUB_WORKSPACE"
                output="$GITHUB_WORKSPACE/bench-results-run-${run}.json"
              fi
              echo "$revision sample ${run}/3"
              bun "$GITHUB_WORKSPACE/scripts/bench-json.ts" --directory "$directory" --output "$output"
            done
          done

      - name: Qualify benchmark comparison
        if: steps.policy.outputs.mode != 'skip' && steps.baseline.outputs.unavailable != 'true'
        run: bun scripts/bench-qualify.ts

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-results
          path: |
            bench-policy.json
            bench-summary.md
            bench-baseline.json
            bench-results.json
            bench-baseline-run-*.json
            bench-results-run-*.json
          if-no-files-found: error
          retention-days: 30
