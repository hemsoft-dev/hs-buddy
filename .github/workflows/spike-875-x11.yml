# Throwaway reproduction for hs-buddy#875; runs only on its own spike branch.
# Rounds 1-3 (a minimal wry + tao program: switching variants, the real fixture
# pages with the app's handlers, a GPUI-like 32-bit ARGB parent) all rendered the
# second page. Round 4 runs the real app: #875's own package and browser driver.
name: spike-875-x11

on:
  push:
    branches: [spike/875-x11-black]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c02febd22ed613aaed06b7d1b251128e42b24ce9
          persist-credentials: false

      - name: Setup package driver Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0

      - uses: ./.github/actions/setup-bun

      - name: Install the checkout's dependencies
        run: bun install --frozen-lockfile

      - name: Fetch #875's Ubuntu package (run 40629646121)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40629646121 -R "$GITHUB_REPOSITORY" -n buddy-native-ubuntu-24.04 -D "$RUNNER_TEMP/artifact"
          find "$RUNNER_TEMP/artifact" -name '*.deb' -o -name build.json | head

      - name: Install the package and desktop tools
        run: |
          deb="$(find "$RUNNER_TEMP/artifact" -name '*.deb' | head -n 1)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$deb"
          source scripts/native-smoke/linux-desktop-tools.sh
          buddy_install_linux_desktop_tools sudo apt-get
          electron_executable="$(bun -e "console.log(require('electron'))" | tail -n 1)"
          sandbox="$(realpath "$(dirname "$electron_executable")/chrome-sandbox")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          dpkg-query -W -f='${Version}\n' buddy-native libwebkit2gtk-4.1-0

      - name: Browser qualification per variant
        run: |
          version="$(dpkg-query -W -f='${Version}' buddy-native)"
          variant() {
            name="$1"; shift
            echo "== $name"
            env "$@" RUST_LOG=info,wry=debug xvfb-run -a -s '-screen 0 1600x1000x24' bash -c '
              openbox >/dev/null 2>&1 &
              BUDDY_SETTINGS_FIXTURE=1 python3 scripts/native-smoke/browser-desktop.py --executable "$(command -v buddy-native)" \
                --output "$RUNNER_TEMP/ev/$0" --session x11 --version "$1"
            ' "$name" "$version" 2>&1 | tail -n 15 && echo "RESULT $name passed" || echo "RESULT $name failed"
          }
          mkdir -p "$RUNNER_TEMP/ev"
          variant base SPIKE=1
          variant nocompositing WEBKIT_DISABLE_COMPOSITING_MODE=1
          variant nodmabuf WEBKIT_DISABLE_DMABUF_RENDERER=1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-875-app
          path: ${{ runner.temp }}/ev/
