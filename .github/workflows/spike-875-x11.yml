# Throwaway reproduction for hs-buddy#875; runs only on its own spike branch.
# Round 8: #875's own Windows package (run 40647223188, head 043b914f) through
# only the browser qualification, with the next driver change applied, to see
# the whole Windows flow (restart and light passes) before a 90-minute CI round.
name: spike-875-x11

on:
  push:
    branches: [spike/875-x11-black]

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 043b914fea3cca23e15a52b1f09459b41b96f3a6
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: spike-source
          persist-credentials: false

      - name: Apply the next driver change
        # The runner checks out CRLF, the patch file included. Re-check out the
        # app as LF and strip the patch's CRs before applying it.
        shell: bash
        run: |
          git config core.autocrlf false
          git rm -r -q --cached .
          git reset -q --hard
          sed 's/\r$//' spike-source/spike/875-x11/driver-checks.patch | git apply --verbose -

      - name: Install Windows OCR
        shell: pwsh
        run: |
          $tesseractDirectory = 'C:\Program Files\Tesseract-OCR'
          $env:PATH = "$tesseractDirectory;$env:PATH"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install tesseract ffmpeg --yes --no-progress
            if ($LASTEXITCODE -eq 0 -and (Get-Command tesseract -ErrorAction SilentlyContinue) -and (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { break }
            if ($attempt -eq 3) { throw 'OCR tools missing' }
            Start-Sleep -Seconds 30
          }
          tesseract --version
          $tesseractDirectory | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup package driver Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0

      - uses: ./.github/actions/setup-bun

      - name: Install the checkout's dependencies
        run: bun install --frozen-lockfile

      - name: Fetch #875's Windows package (run 40647223188)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40647223188 -R $env:GITHUB_REPOSITORY -n buddy-native-windows-2025 -D "$env:RUNNER_TEMP\artifact"

      - name: Install and run the browser qualification
        shell: pwsh
        run: |
          $manifest = Get-ChildItem "$env:RUNNER_TEMP\artifact" -Recurse -Filter build.json | Select-Object -First 1
          $metadata = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          $installer = Join-Path $manifest.DirectoryName $metadata.package.file
          $install = Join-Path $env:RUNNER_TEMP 'buddy-native-installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$install") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Join-Path $install 'buddy-native.exe'
          $env:BUDDY_SETTINGS_FIXTURE = '1'
          # Only so windows-window.ps1 keeps the app's output in app.log.
          $env:BUDDY_COPILOT_FIXTURE = '1'
          $env:RUST_LOG = 'info'
          & python scripts/native-smoke/browser-desktop.py --executable $exe --output "$env:RUNNER_TEMP\ev\browser" --session windows --version $metadata.version
          "browser qualification exit $LASTEXITCODE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-875-windows
          path: ${{ runner.temp }}/ev/
