name: Settings input diagnosis

on:
  push:
    branches: [mission/838-settings-input-probe-20261017]

permissions:
  contents: read
  actions: read

concurrency:
  group: settings-input-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Original package mouse trace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: 12116046320
            package-sha: 6f68159944384096cd16a4f376a88367482870d63d678d1a68a7733516b87680
          - os: macos-15
            artifact: 12116561156
            package-sha: 322a8f343558c5ee772a0355f89fab4d48fee03c44efe71292259ac726760ff8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install macOS desktop tools and compile passive monitor
        run: |
          brew install tesseract ffmpeg
          swift build --configuration release --product buddy-window-info
          cp .build/release/buddy-window-info "$RUNNER_TEMP/buddy-window-info"
          swift build --configuration release --product buddy-ocr-words
          cp .build/release/buddy-ocr-words "$RUNNER_TEMP/buddy-ocr-words"
          swiftc scripts/native-smoke/macos-mouse-trace.swift -o "$RUNNER_TEMP/buddy-mouse-trace"
          printf 'BUDDY_SETTINGS_OCR_HELPER=%s\n' "$RUNNER_TEMP/buddy-ocr-words" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: ./.github/actions/setup-bun
      - name: Install shared credential adapter
        run: bun install --frozen-lockfile
      - name: Monitor lifecycle and existing desktop guards
        run: python3 -B -m unittest discover -s scripts/native-smoke -p 'test_*.py'
      - name: Download the exact previously failed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ matrix.artifact }}
          run-id: 39071538595
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-package
          digest-mismatch: error
      - name: Verify original package provenance
        env:
          EXPECTED_PACKAGE_SHA: ${{ matrix.package-sha }}
          ORIGINAL_ARTIFACT: ${{ matrix.artifact }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'original-package'
          manifests = list(root.rglob('build.json'))
          assert len(manifests) == 1
          manifest = json.loads(manifests[0].read_text())
          assert manifest['sourceSha'] == '1cc50f6e8b5ce56fb5b6c57dc58657a0c4750d9f'
          assert manifest['sourceDirty'] is False and manifest['version'] == '0.1.1456'
          assert manifest['profile'] == 'release'
          package = manifests[0].parent / manifest['package']['file']
          assert package.parent == manifests[0].parent and package.is_file()
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          assert package.stat().st_size == manifest['package']['size']
          assert digest == manifest['package']['sha256'] == os.environ['EXPECTED_PACKAGE_SHA']
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'settings-input-probe'
          output.mkdir()
          receipt = dict(diagnosticOnly=True, appSource=manifest['sourceSha'], harnessSource=os.environ['GITHUB_SHA'], originalRun=39071538595, originalArtifact=int(os.environ['ORIGINAL_ARTIFACT']), package=manifest['package'])
          (output / 'original-package-provenance.json').write_text(json.dumps(receipt, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'ORIGINAL_PACKAGE_DIRECTORY={manifests[0].parent}\n')
          PY
      - name: Exercise unchanged package with passive owned-process mouse tracing
        env:
          BUDDY_MAC_MOUSE_MONITOR: ${{ runner.temp }}/buddy-mouse-trace
        run: bash scripts/native-smoke/settings-input-probe-install.sh "$ORIGINAL_PACKAGE_DIRECTORY" "$RUNNER_TEMP/settings-input-probe"
      - name: Preserve original evidence and source provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-package-mouse-trace-${{ matrix.os }}
          path: ${{ runner.temp }}/settings-input-probe/**
          if-no-files-found: error
