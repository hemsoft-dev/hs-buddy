name: Settings input diagnosis

on:
  push:
    branches: [mission/838-settings-input-probe-20261017]

permissions:
  contents: read

concurrency:
  group: settings-input-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: ARM settings input probe
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install macOS desktop tools
        run: |
          brew install tesseract ffmpeg
          swift package describe
          swift build --configuration release --product buddy-window-info
          cp .build/release/buddy-window-info "$RUNNER_TEMP/buddy-window-info"
          swift build --configuration release --product buddy-ocr-words
          cp .build/release/buddy-ocr-words "$RUNNER_TEMP/buddy-ocr-words"
          printf 'BUDDY_SETTINGS_OCR_HELPER=%s\n' "$RUNNER_TEMP/buddy-ocr-words" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-07
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          cache-on-failure: true
      - uses: ./.github/actions/setup-bun
      - name: Install the shared credential adapter
        run: bun install --frozen-lockfile
      - name: Install pinned native packager
        working-directory: rust
        run: |
          version="$(node -p "require('./desktop-package.json').packagerVersion")"
          cargo install cargo-packager --version "=$version" --locked
      - name: Build diagnostic native release package
        id: package
        run: node scripts/package-native.mjs
      - name: Exercise the unchanged settings sequence
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: bash scripts/native-smoke/settings-input-probe-install.sh "$PACKAGE_DIRECTORY" "$RUNNER_TEMP/settings-input-probe"
      - name: Preserve diagnostic package and original evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-input-probe-arm
          path: |
            release/native/**/build.json
            release/native/**/*.dmg
            ${{ runner.temp }}/settings-input-probe/**
          if-no-files-found: error
