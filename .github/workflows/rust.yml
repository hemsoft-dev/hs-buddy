name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      # build.rs embeds the version from package.json; a release bump must
      # produce native binaries too.
      - 'package.json'
      - 'Package.swift'
      - 'scripts/package-native*'
      - 'scripts/native-binary.mjs'
      - 'scripts/native-smoke/**'
      - 'electron/services/pollenCredentials*'
      - 'public/icon-512.png'
      - 'public/icon.ico'
      - 'LICENSE'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - 'package.json'
      - 'Package.swift'
      - 'scripts/package-native*'
      - 'scripts/native-binary.mjs'
      - 'scripts/native-smoke/**'
      - 'electron/services/pollenCredentials*'
      - 'public/icon-512.png'
      - 'public/icon.ico'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Healthy runs on main fd961edf (#852): Intel 134-146 minutes, Apple silicon
    # 84, Windows 74, Ubuntu 69, before automation qualification was added.
    # These limits keep at least 30 minutes of headroom and still stop a hang.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 210 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # scripts/lib/bounded-apt.sh limits each attempt, so a slow mirror fails
      # here with a message rather than at the job limit.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 45
        run: |
          source scripts/lib/bounded-apt.sh
          buddy_apt sudo update
          buddy_apt sudo install -y --no-install-recommends \
            build-essential cmake clang pkg-config mold \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libxcb1-dev libxcb-xkb-dev libfontconfig1-dev libasound2-dev \
            libssl-dev libdbus-1-dev dbus-x11 gnome-keyring libglib2.0-bin \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install macOS desktop qualification tools
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          brew install tesseract ffmpeg
          swift package describe
          swift build --configuration release --product buddy-window-info
          cp .build/release/buddy-window-info "$RUNNER_TEMP/buddy-window-info"
          swift build --configuration release --product buddy-ocr-words
          cp .build/release/buddy-ocr-words "$RUNNER_TEMP/buddy-ocr-words"
          printf 'BUDDY_SETTINGS_OCR_HELPER=%s\n' "$RUNNER_TEMP/buddy-ocr-words" >> "$GITHUB_ENV"

      - name: Install Windows OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey exits 0 with "installed 0/0 packages" when its feed
          # returns 503 (#851), so judge each attempt by the tools themselves.
          $tesseractDirectory = 'C:\Program Files\Tesseract-OCR'
          $env:PATH = "$tesseractDirectory;$env:PATH"
          $tools = [ordered]@{ tesseract = '--version'; ffmpeg = '-version' }
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            choco install tesseract ffmpeg --yes --no-progress
            $chocoExit = $LASTEXITCODE
            $missing = @($tools.Keys | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) })
            if ($chocoExit -eq 0 -and $missing.Count -eq 0) { break }
            if ($attempt -eq $attempts) {
              throw "Chocolatey attempt $attempt of $attempts exited $chocoExit; missing: $($missing -join ', ')"
            }
            Write-Warning "Chocolatey attempt $attempt of $attempts exited $chocoExit; missing: $($missing -join ', '). Retrying in 30 seconds."
            Start-Sleep -Seconds 30
          }
          foreach ($tool in $tools.Keys) {
            & $tool $tools[$tool]
            if ($LASTEXITCODE -ne 0) { throw "$tool $($tools[$tool]) exited $LASTEXITCODE" }
          }
          $tesseractDirectory | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup package driver Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-07
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          # Preserve compiled dependencies when an installed UI assertion fails.
          # Cargo fingerprints and every qualification gate still run next time.
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build headless terminal transport probes
        run: cargo build --locked -p buddy-core --example terminal-host --example terminal-smoke

      - name: Qualify PTY input, output, resize, interrupt, and process cleanup
        working-directory: .
        timeout-minutes: 5
        run: python scripts/native-smoke/terminal-transport.py --expected-source ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Install the shared credential adapter
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Qualify Electron config rollback
        shell: bash
        run: |
          cargo build --locked --workspace --example config-migration-probe
          probe="target/debug/examples/config-migration-probe"
          if [[ "$RUNNER_OS" == "Windows" ]]; then probe="$probe.exe"; fi
          bun crates/buddy-core/tests/electron-rollback.ts "$probe"

      - name: Build the credential interop probe
        run: cargo build -p buddy-core --example pollen-credential-probe

      - name: Qualify credential sharing on Windows and macOS
        if: runner.os != 'Linux'
        working-directory: .
        env:
          BUDDY_CREDENTIAL_FIXTURE: '1'
          BUDDY_CREDENTIAL_EVIDENCE: ${{ runner.temp }}/native-evidence/credentials/interop.json
        run: bun scripts/native-smoke/credential-interop.ts

      - name: Qualify persistent Secret Service credential sharing
        if: runner.os == 'Linux'
        working-directory: .
        env:
          BUDDY_CREDENTIAL_FIXTURE: '1'
          BUDDY_CREDENTIAL_EVIDENCE: ${{ runner.temp }}/native-evidence/credentials/interop.json
          XDG_DATA_HOME: ${{ runner.temp }}/buddy-credential-session/data
          XDG_CACHE_HOME: ${{ runner.temp }}/buddy-credential-session/cache
          XDG_RUNTIME_DIR: ${{ runner.temp }}/buddy-credential-session/runtime
        run: |
          mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR/keyring"
          chmod 700 "$XDG_RUNTIME_DIR" "$XDG_RUNTIME_DIR/keyring"
          dbus-run-session -- bash -euo pipefail <<'CREDENTIAL_SESSION'
          printf '\n' | gnome-keyring-daemon --unlock --foreground --components=secrets \
            --control-directory="$XDG_RUNTIME_DIR/keyring" > "$XDG_RUNTIME_DIR/keyring.log" 2>&1 &
          keyring_pid=$!
          trap 'kill "$keyring_pid" 2>/dev/null || true; wait "$keyring_pid" 2>/dev/null || true' EXIT
          gdbus wait --session --timeout 10 org.freedesktop.secrets
          bun scripts/native-smoke/credential-interop.ts
          CREDENTIAL_SESSION

      - name: Package and visual failure guards
        working-directory: .
        run: |
          node --test scripts/package-native.test.mjs
          python -m unittest discover -s scripts/native-smoke -p 'test_*.py'

      - name: Windows cleanup and recording failure guards
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          ./scripts/native-smoke/test-cleanup.ps1
          ./scripts/native-smoke/test-windows-assertions.ps1
          ./scripts/native-smoke/test-windows-recording.ps1

      # Advisory, license and source gate for the Rust dependency graph
      # (policy in rust/deny.toml). Once per run is enough.
      - name: Dependency audit (cargo-deny)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          command: check
          rust-version: stable

      - name: Install pinned native packager
        shell: bash
        run: |
          version="$(node -p "require('./desktop-package.json').packagerVersion")"
          cargo install cargo-packager --version "=$version" --locked

      # Spotlight indexing of the freshly mounted DMG volume kept it busy, and
      # create-dmg's three detach attempts failed with "Resource busy".
      - name: Stop Spotlight indexing for DMG packaging
        if: runner.os == 'macOS'
        working-directory: .
        run: sudo mdutil -a -i off

      - name: Build native release package
        id: package
        working-directory: .
        run: node scripts/package-native.mjs

      - name: Install and qualify Windows package
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          & scripts/native-smoke/install-windows.ps1 -PackageDirectory $env:PACKAGE_DIRECTORY -Output "$env:RUNNER_TEMP/native-evidence/windows"

      - name: Install and qualify Unix package
        if: runner.os != 'Windows'
        working-directory: .
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: bash scripts/native-smoke/install-unix.sh "$PACKAGE_DIRECTORY" "$RUNNER_TEMP/native-evidence"

      - name: Upload native packages and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buddy-native-${{ matrix.os }}
          path: |
            release/native/**/build.json
            release/native/**/*.exe
            release/native/**/*.deb
            release/native/**/*.dmg
            ${{ runner.temp }}/native-evidence/**
            ${{ runner.temp }}/buddy-settings-backend-*/backend.log
          if-no-files-found: error
