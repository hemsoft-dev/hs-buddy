name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      # build.rs embeds the version from package.json; a release bump must
      # produce native binaries too.
      - 'package.json'
      - 'scripts/package-native*'
      - 'scripts/native-binary.mjs'
      - 'scripts/native-smoke/**'
      - 'public/icon-512.png'
      - 'public/icon.ico'
      - 'LICENSE'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - 'package.json'
      - 'scripts/package-native*'
      - 'scripts/native-binary.mjs'
      - 'scripts/native-smoke/**'
      - 'public/icon-512.png'
      - 'public/icon.ico'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config mold \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libxcb1-dev libxcb-xkb-dev libfontconfig1-dev libasound2-dev \
            libssl-dev libdbus-1-dev

      - name: Install macOS desktop qualification tools
        if: runner.os == 'macOS'
        run: |
          brew install tesseract ffmpeg
          swiftc ../scripts/native-smoke/macos-window.swift -o "$RUNNER_TEMP/buddy-window-info"

      - name: Install Windows OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract ffmpeg --yes --no-progress
          'C:\Program Files\Tesseract-OCR' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup package driver Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-07
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Preserve compiled dependencies when an installed UI assertion fails.
          # Cargo fingerprints and every qualification gate still run next time.
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Package and visual failure guards
        working-directory: .
        run: |
          node --test scripts/package-native.test.mjs
          python -m unittest discover -s scripts/native-smoke -p test_desktop.py

      - name: Windows cleanup failure guards
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          ./scripts/native-smoke/test-cleanup.ps1
          ./scripts/native-smoke/test-windows-assertions.ps1

      # Advisory, license and source gate for the Rust dependency graph
      # (policy in rust/deny.toml). Once per run is enough.
      - name: Dependency audit (cargo-deny)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          command: check
          rust-version: stable

      - name: Install pinned native packager
        shell: bash
        run: |
          version="$(node -p "require('./desktop-package.json').packagerVersion")"
          cargo install cargo-packager --version "=$version" --locked

      - name: Build native release package
        id: package
        working-directory: .
        run: node scripts/package-native.mjs

      - name: Install and qualify Windows package
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          & scripts/native-smoke/install-windows.ps1 -PackageDirectory $env:PACKAGE_DIRECTORY -Output "$env:RUNNER_TEMP/native-evidence"

      - name: Install and qualify Unix package
        if: runner.os != 'Windows'
        working-directory: .
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: bash scripts/native-smoke/install-unix.sh "$PACKAGE_DIRECTORY" "$RUNNER_TEMP/native-evidence"

      - name: Upload native packages and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buddy-native-${{ matrix.os }}
          path: |
            release/native/**/build.json
            release/native/**/*.exe
            release/native/**/*.deb
            release/native/**/*.dmg
            ${{ runner.temp }}/native-evidence/**
          if-no-files-found: error
