name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    uses: ./.github/workflows/benchmarks.yml

  memory-policy:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
    steps:
      - name: Checkout repository and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Classify memory impact
        id: policy
        run: bun scripts/ci-memory-policy.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Restore Aspire SDK
        timeout-minutes: 15
        uses: ./.github/actions/restore-aspire

      - name: Lint (ESLint)
        run: bun run lint

      - name: Check for unused code and dependencies
        run: bun run knip

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Lint Markdown
        run: bun run lint:md

      - name: Analyze dependency health
        run: bun run e18e

      - name: Check architecture boundaries (dependency-cruiser)
        run: bun run deps:check

      - name: Quality gate lint
        run: bun run lint:quality

      - name: Electron security check
        run: bun scripts/check-electron-security.ts

  react-doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check React Doctor
        run: bun run react-doctor
      - name: Upload React Doctor report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: react-doctor-${{ matrix.os }}
          path: reports/react-doctor/
          if-no-files-found: error
          retention-days: 30

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Restore Aspire SDK
        timeout-minutes: 15
        uses: ./.github/actions/restore-aspire

      - name: Type check (TypeScript + Convex)
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Run completion audio tests
        run: bun run test:completion-audio

      - name: Restore pinned Node.js for renderer coverage
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Report coverage perfection target
        run: bun run coverage:perfection

      - name: Report coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Test Coverage"
              echo ""
              echo "| Category | Covered |"
              echo "|----------|---------|"
            } >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const data = require('./coverage/coverage-summary.json');
              const t = data.total;
              ['statements','branches','functions','lines'].forEach(k => {
                const pct = t[k].pct.toFixed(1);
                const line = '| ' + k.charAt(0).toUpperCase() + k.slice(1) + ' | ' + pct + '% |';
                require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n');
              });
            "
          fi

      - name: Prepare coverage artifacts for scorecard
        if: always()
        run: |
          mkdir -p coverage-upload
          if [ -f coverage/cobertura-coverage.xml ]; then
            grep -v '<!DOCTYPE' coverage/cobertura-coverage.xml > coverage-upload/cobertura-coverage.xml || true
            if [ ! -s coverage-upload/cobertura-coverage.xml ]; then
              echo "::warning::Failed to create cleaned Cobertura XML (file missing or empty)"
              rm -f coverage-upload/cobertura-coverage.xml
            elif grep -q '<!DOCTYPE' coverage-upload/cobertura-coverage.xml; then
              echo "::warning::DOCTYPE still present — removing Cobertura XML to prevent parser hangs"
              rm -f coverage-upload/cobertura-coverage.xml
            else
              echo "✓ DOCTYPE stripped from Cobertura XML"
            fi
          fi
          [ -f coverage/coverage-summary.json ] && cp coverage/coverage-summary.json coverage-upload/
          [ -f coverage/lcov.info ] && cp coverage/lcov.info coverage-upload/
          ls -la coverage-upload/ 2>/dev/null || echo "::warning::No coverage files to upload"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cobertura-coverage
          path: coverage-upload/*
          if-no-files-found: warn
          retention-days: 30

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Restore mutation baseline cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: reports/mutation/stryker-incremental.json
          key: ${{ runner.os }}-stryker-${{ hashFiles('bun.lock', 'stryker.config.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-stryker-${{ hashFiles('bun.lock', 'stryker.config.json') }}-

      - name: Run mutation quality gate
        timeout-minutes: 15
        run: bun run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30

  test-electron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Run electron tests with coverage
        run: bun run test:electron:coverage

  test-ipc-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Run IPC contract tests
        run: bun run test:ipc-contracts

  test-convex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Run Convex server function tests with coverage
        run: bun run test:convex:coverage

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Ensure Chrome is available for E2E
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            npx playwright install --with-deps chrome
          fi

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true
          VITE_CONVEX_URL: https://placeholder-e2e.convex.cloud

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-test-results
          path: |
            e2e-results.xml
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  test-electron-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install virtual display server
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Run real Electron E2E tests
        run: xvfb-run --auto-servernum bun run test:e2e:electron
        env:
          CI: true

      - name: Upload Electron E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: electron-e2e-results
          path: |
            electron-e2e-results.xml
            test-results/
            playwright-electron-report/
          if-no-files-found: warn
          retention-days: 7

  electron-memory-sample:
    needs: memory-policy
    if: needs.memory-policy.outputs.mode == 'run'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Electron builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ${{ runner.temp }}\electron-builder-cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Collect packaged Electron memory sample
        run: bun run perf:memory:electron --runs 1 --collect-only --output electron-memory-${{ matrix.sample }}.json
        env:
          MEMORY_SAMPLE_ID: ${{ matrix.sample }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          VITE_CONVEX_URL: https://placeholder-memory-ci.convex.cloud

      - name: Upload Electron memory result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: electron-memory-sample-${{ matrix.sample }}
          path: electron-memory-${{ matrix.sample }}.json
          if-no-files-found: error
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Build (vite + electron)
        run: npx vite build

      - name: Check production CSP
        run: bun run security:csp

      - name: Check bundle sizes
        run: bun run bundle-size

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    needs: typecheck
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            builder-platform: win
            target: nsis
            platform: win32
            arch: x64
          - name: Linux x64
            runner: ubuntu-24.04
            node-version: 22.12.0
            builder-platform: linux
            target: deb
            platform: linux
            arch: x64
          - name: macOS Intel
            runner: macos-15-intel
            builder-platform: mac
            target: dmg
            platform: darwin
            arch: x64
          - name: macOS Apple silicon
            runner: macos-15
            builder-platform: mac
            target: dmg
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version || '24.12.0' }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # A stalled cache restore once consumed the whole job timeout on macOS.
      # The cache only saves time, so fall back to a cold install instead.
      - name: Cache Bun dependencies
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install Linux display server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Build application
        run: bunx vite build
        env:
          VITE_CONVEX_URL: https://placeholder-package-ci.convex.cloud

      - name: Build distributable
        run: bunx electron-builder --${{ matrix.builder-platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never --config.npmRebuild=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Install Linux distributable
        if: runner.os == 'Linux'
        run: |
          package_file="$(find release -type f -name '*.deb' -print -quit)"
          sudo apt-get install --yes "./$package_file"
          executable="$(find /opt -type f -name Buddy -perm /111 -print -quit)"
          test -n "$executable"
          echo "BUDDY_PACKAGE_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Install Windows distributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/install-windows-package.ps1
          -ReleaseDirectory release
          -InstallDirectory (Join-Path $env:RUNNER_TEMP 'Buddy-installed')

      - name: Mount macOS distributable
        if: runner.os == 'macOS'
        run: |
          dmg="$(find release -type f -name '*.dmg' -print -quit)"
          mount="$RUNNER_TEMP/buddy-dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          executable="$mount/Buddy.app/Contents/MacOS/Buddy"
          test -x "$executable"
          echo "BUDDY_PACKAGE_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Start packaged application
        run: bun run package:smoke -- ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Unmount macOS distributable
        if: always() && runner.os == 'macOS'
        run: hdiutil detach "$RUNNER_TEMP/buddy-dmg" || true

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/package-smoke*.json
            release/package-smoke*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed distributable
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failed-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/**/*.exe
            release/**/*.deb
            release/**/*.dmg
          if-no-files-found: warn
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Build renderer for Lighthouse
        run: npx vite build --mode e2e
        env:
          VITE_CONVEX_URL: https://placeholder-lhci.convex.cloud

      - name: Run Lighthouse CI
        run: bun run lhci
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Report Lighthouse scores
        if: always()
        run: bun scripts/lighthouse-report.ts

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-results
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  ci-feedback:
    runs-on: ubuntu-latest
    needs:
      [
        memory-policy,
        lint,
        typecheck,
        test,
        mutation,
        test-electron,
        test-ipc-contracts,
        test-convex,
        test-e2e,
        test-electron-e2e,
        build,
      ]
    if: always()
    steps:
      - name: Check fast feedback jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  test-electron-memory:
    runs-on: ubuntu-latest
    needs: [memory-policy, electron-memory-sample]
    if: always()
    steps:
      - name: Validate qualification policy and sample jobs
        env:
          POLICY_RESULT: ${{ needs.memory-policy.result }}
          MODE: ${{ needs.memory-policy.outputs.mode }}
          SAMPLES_RESULT: ${{ needs.electron-memory-sample.result }}
        run: |
          test "$POLICY_RESULT" = success
          case "$MODE:$SAMPLES_RESULT" in
            run:success) ;;
            skip:skipped) echo "Memory qualification not needed for these changes." ;;
            defer:skipped)
              echo "::error::Memory qualification deferred during draft review. Use ci-feedback for review iterations; mark ready when feedback is resolved."
              exit 1 ;;
            *) echo "::error::Unexpected memory qualification state: $MODE:$SAMPLES_RESULT"; exit 1 ;;
          esac
      - name: Checkout repository
        if: needs.memory-policy.outputs.mode == 'run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Bun
        if: needs.memory-policy.outputs.mode == 'run'
        uses: ./.github/actions/setup-bun
      - name: Download all memory samples
        if: needs.memory-policy.outputs.mode == 'run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: electron-memory-sample-*
          path: memory-samples
          merge-multiple: true
      - name: Enforce combined median memory budgets
        if: needs.memory-policy.outputs.mode == 'run'
        run: bun perf/electron-memory-aggregate.ts memory-samples electron-memory-result.json
      - name: Upload combined memory result
        if: always() && needs.memory-policy.outputs.mode == 'run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: electron-memory-result
          path: electron-memory-result.json
          if-no-files-found: warn
          retention-days: 30

  crap-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [renderer, electron, convex]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Collect original-source function coverage
        run: bun run crap:coverage ${{ matrix.suite }}
      - name: Upload function coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crap-coverage-${{ matrix.suite }}
          path: reports/crap/
          if-no-files-found: error
          retention-days: 30

  crap:
    runs-on: ubuntu-latest
    needs: [crap-coverage]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download function coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crap-coverage-*
          path: reports/crap
          merge-multiple: true
      - name: Enforce per-function CRAP policy
        if: always()
        env:
          COVERAGE_RESULT: ${{ needs.crap-coverage.result }}
        run: bun run crap
      - name: Upload CRAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crap-report
          path: reports/crap/report.json
          if-no-files-found: error
          retention-days: 30

  ci-complete:
    runs-on: ubuntu-latest
    needs:
      [ci-feedback, test-electron-memory, package-smoke, react-doctor, lighthouse, benchmarks, crap]
    if: always()
    steps:
      - name: Check final qualification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
