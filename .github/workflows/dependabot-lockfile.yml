name: Dependabot Lockfile Fix

# Dependabot cannot update Bun lockfiles itself. Keep package installation in a
# read-only job, then let a trusted job write only the validated bun.lock blob.

on:
  # This event loads the workflow from the trusted base branch. Job-level
  # permissions still keep PR checkout and package execution read-only.
  pull_request_target:
    branches: [main]

permissions: {}

jobs:
  generate-lockfile:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.validate.outputs.changed }}
      lockfile-sha256: ${{ steps.validate.outputs.lockfile-sha256 }}
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Update lockfile
        run: bun install --no-frozen-lockfile

      - name: Validate generated files
        id: validate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f bun.lock
          test ! -L bun.lock
          test "$(git ls-files --stage -- bun.lock | awk '{print $1}')" = "100644"

          mapfile -t tracked_changes < <(git diff --name-only --diff-filter=ACDMRTUXB)
          mapfile -t staged_changes < <(git diff --cached --name-only --diff-filter=ACDMRTUXB)
          mapfile -t untracked_changes < <(git ls-files --others --exclude-standard)

          if [ "${#staged_changes[@]}" -ne 0 ] || [ "${#untracked_changes[@]}" -ne 0 ]; then
            printf 'Unexpected staged files: %s\n' "${staged_changes[*]:-none}" >&2
            printf 'Unexpected untracked files: %s\n' "${untracked_changes[*]:-none}" >&2
            exit 1
          fi
          if [ "${#tracked_changes[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile already up to date"
            exit 0
          fi
          if [ "${#tracked_changes[@]}" -ne 1 ] || [ "${tracked_changes[0]}" != "bun.lock" ]; then
            printf 'Expected only bun.lock to change, got: %s\n' "${tracked_changes[*]}" >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "lockfile-sha256=$(sha256sum bun.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify frozen install
        if: steps.validate.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Upload lockfile result
        if: steps.validate.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependabot-lockfile-${{ github.run_id }}-${{ github.run_attempt }}
          path: bun.lock
          if-no-files-found: error
          retention-days: 1

  commit-lockfile:
    needs: generate-lockfile
    if: needs.generate-lockfile.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Download generated lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependabot-lockfile-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Validate artifact and current Dependabot head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_LOCKFILE_SHA256: ${{ needs.generate-lockfile.outputs.lockfile-sha256 }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$BASE_REF" = "main"
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          case "$HEAD_REF" in dependabot/*) ;; *) exit 1 ;; esac

          mapfile -t artifact_entries < <(find artifact -mindepth 1 -printf '%P\n')
          if [ "${#artifact_entries[@]}" -ne 1 ] || [ "${artifact_entries[0]}" != "bun.lock" ]; then
            printf 'Expected one bun.lock artifact, got: %s\n' "${artifact_entries[*]:-none}" >&2
            exit 1
          fi
          test -f artifact/bun.lock
          test ! -L artifact/bun.lock
          test "$(sha256sum artifact/bun.lock | cut -d' ' -f1)" = "$EXPECTED_LOCKFILE_SHA256"

          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > pr.json
          test "$(jq -r .state pr.json)" = "open"
          test "$(jq -r .user.login pr.json)" = "dependabot[bot]"
          test "$(jq -r .base.ref pr.json)" = "$BASE_REF"
          test "$(jq -r .head.repo.full_name pr.json)" = "$REPOSITORY"
          test "$(jq -r .head.ref pr.json)" = "$HEAD_REF"
          test "$(jq -r .head.sha pr.json)" = "$EXPECTED_HEAD"

      - name: Commit lockfile through the Git Database API
        id: commit-lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base_tree="$(gh api "repos/$REPOSITORY/git/commits/$EXPECTED_HEAD" --jq .tree.sha)"

          base64 -w0 artifact/bun.lock | jq -Rs '{content: ., encoding: "base64"}' > blob.json
          blob_sha="$(gh api --method POST "repos/$REPOSITORY/git/blobs" --input blob.json --jq .sha)"

          jq -n \
            --arg base_tree "$base_tree" \
            --arg blob "$blob_sha" \
            '{base_tree: $base_tree, tree: [{path: "bun.lock", mode: "100644", type: "blob", sha: $blob}]}' \
            > tree.json
          tree_sha="$(gh api --method POST "repos/$REPOSITORY/git/trees" --input tree.json --jq .sha)"

          jq -n \
            --arg message "chore: update bun.lock for Dependabot PR #$PR_NUMBER" \
            --arg tree "$tree_sha" \
            --arg parent "$EXPECTED_HEAD" \
            '{message: $message, tree: $tree, parents: [$parent]}' \
            > commit.json
          commit_sha="$(gh api --method POST "repos/$REPOSITORY/git/commits" --input commit.json --jq .sha)"

          # Recheck immediately before the compare-and-update operation. A
          # moved PR head must fail rather than receive a stale lockfile.
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
          jq -n --arg sha "$commit_sha" '{sha: $sha, force: false}' > ref.json
          pushed_sha="$(gh api --method PATCH "repos/$REPOSITORY/git/refs/heads/$HEAD_REF" --input ref.json --jq .object.sha)"
          test "$pushed_sha" = "$commit_sha"

          # The Git ref update is authoritative, but the pull request endpoint
          # can briefly return its cached pre-update head. Wait for the PR view
          # to converge before dispatching CI for the generated commit.
          observed_head=""
          deadline=$((SECONDS + 30))
          for attempt in $(seq 1 30); do
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            observed_head="$(timeout "$remaining" gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha || true)"
            if [ "$observed_head" = "$pushed_sha" ]; then
              break
            fi
            if [ "$attempt" -lt 30 ]; then
              echo "Waiting for pull request head to update ($attempt/30)"
              sleep 1
            fi
          done
          test "$observed_head" = "$pushed_sha"

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$pushed_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch generated-commit CI
        id: dispatch-ci
        if: steps.commit-lockfile.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
          TARGET_SHA: ${{ steps.commit-lockfile.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_REF" --jq .object.sha)" = "$TARGET_SHA"
          gh workflow run ci.yml --ref "$TARGET_REF" --repo "$GITHUB_REPOSITORY"
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --event workflow_dispatch \
              --commit "$TARGET_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Dispatched CI run $run_id for $TARGET_SHA"
              exit 0
            fi
            echo "Waiting for dispatched CI run ($attempt/60)"
            sleep 5
          done
          fallback_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -n "$fallback_run" ]; then
            echo "::warning::No workflow_dispatch CI run appeared for $TARGET_SHA within five minutes; ci.yml run $fallback_run covers the commit instead, so it will not be watched here."
            exit 0
          fi
          echo "::error::No ci.yml run of any kind appeared for $TARGET_SHA; refusing to skip generated-commit validation."
          exit 1

      - name: Wait for generated-commit CI
        if: steps.commit-lockfile.outputs.pushed == 'true' && steps.dispatch-ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.dispatch-ci.outputs.run_id }}
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
          TARGET_SHA: ${{ steps.commit-lockfile.outputs.sha }}
        run: |
          set +e
          gh run watch "$RUN_ID" --compact --exit-status --repo "$GITHUB_REPOSITORY"
          watch_exit=$?
          set -e
          conclusion="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // ""')"
          if [ "$conclusion" = "cancelled" ]; then
            current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_REF" --jq .object.sha)"
            if [ -n "$current_head" ] && [ "$current_head" != "$TARGET_SHA" ]; then
              echo "::warning::Dispatched CI run $RUN_ID was cancelled; lockfile branch moved to $current_head whose own CI gates this PR."
              exit 0
            fi
            echo "::error::Dispatched CI run $RUN_ID was cancelled and no newer commit supersedes $TARGET_SHA."
            exit 1
          fi
          exit $watch_exit
