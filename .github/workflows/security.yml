name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7 ReDoS) has no patched release and
      # reaches only devDependencies. Remove the ignore under #972 once one ships.
      - run: bun audit --audit-level=high --ignore=GHSA-fc5q-39xc-vjpf
