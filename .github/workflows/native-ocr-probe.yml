name: Native OCR probe for mission 837

on:
  push:
    branches: [mission/837-native-ocr-probe-20261017]

permissions:
  contents: read
  actions: read

jobs:
  file-only-probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: buddy-native-macos-15-intel
          run-id: 39020567294
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ocr-source
      - name: Inspect the exact retained capture without launching a window
        run: >-
          python3 scripts/native-smoke/diagnose-macos-ocr.py
          --image "$RUNNER_TEMP/ocr-source/_temp/native-evidence/copilot/sessions-light/wait-status.png"
          --output "$RUNNER_TEMP/ocr-probe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ocr-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/ocr-probe
          if-no-files-found: error
